default_profile = "openai"

[ui]
show_reasoning = false

[tools]
# Disabled tools only reduce the built-in capability set.
disabled = []

# Skills are discovered below .hammer-code/skill/{project,user}/. Evolution is
# opt-in and writes only in accept_edits or unattended permission modes.
[skill]
enabled = true
retrieval_top_k = 3
retrieval_relative_floor = 0.60
retrieval_query_coverage = 0.20

[skill.evolution]
enabled = true
max_history_messages = 8
max_input_tokens = 4000
max_maintenance_input_tokens = 64000
merge_candidate_top_k = 10
forced_merge_score = 0.90
forced_merge_margin = 0.10
max_body_chars = 32000
max_corrections = 2
prune_unused_days = 90
prune_min_retrieve = 20
prune_min_relevant = 10
prune_relevant_used_ratio = 5.0

# Predefined Subagents are read from .hammer-code/subagents/*.md. These bounds
# apply to their in-process runs; no real Subagent definitions are created here.
[subagent]
default_max_iterations = 20
max_background_tasks = 4
# Application-side budget for each inline or background invocation. This uses
# provider usage when available and conservative local estimates otherwise; it
# is not an absolute provider billing limit for an already-started request.
max_task_tokens = 200000

# Local context-budget estimates, not provider-reported token usage.
[context]
tool_result_overflow_tokens = 5000
tool_result_preview_tokens = 2000
tool_batch_tokens = 20000
stale_after_turns = 10
stale_tool_result_tokens = 200
max_context_tokens = 300000
compact_trigger_tokens = 270000
summary_target_tokens = 30000
recovery_file_count = 5
recovery_file_tokens = 5000

# MCP servers connect in the background after the CLI starts. The values in `env`
# map a child-process variable name to the name of a variable already in Hammer
# Code's environment; do not put secrets in this file.
[[mcp]]
name = "example-stdio"
description = "Example local MCP server"
transport = "stdio"
command = "python"
args = ["path/to/mcp_server.py"]
# env = { SERVICE_TOKEN = "EXAMPLE_SERVICE_TOKEN" }

[[mcp]]
name = "example-http"
description = "Example authenticated remote Streamable HTTP MCP server"
transport = "streamable_http"
endpoint = "https://mcp.example.test/mcp"
# This is an environment variable name, not a token value. Do not use `env` for HTTP MCP.
bearer_token_env = "EXAMPLE_MCP_TOKEN"

[profiles.openai]
protocol = "openai_responses"
model = "gpt-5-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_output_tokens = 4096
timeout_seconds = 60
max_retries = 0

[profiles.openai_compatible]
protocol = "openai_chat_completions"
model = "your-model"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
max_output_tokens = 4096
timeout_seconds = 60
max_retries = 0
stream_include_usage = true

[profiles.anthropic]
protocol = "anthropic_messages"
model = "claude-sonnet-4-20250514"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
max_output_tokens = 4096
timeout_seconds = 60
max_retries = 0
thinking_mode = "disabled"
