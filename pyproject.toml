[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hammer-code"
version = "0.1.0"
description = "A lightweight, protocol-neutral CLI coding assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.80",
  "httpx2>=2.5,<3",
  "mcp>=2.0,<3",
  "openai>=2.0",
  "pydantic>=2.10",
  "rich>=13.9",
]

[project.scripts]
hammer-code = "hammer_code.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyright>=1.1.390",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hammer_code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires explicitly enabled network credentials"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
